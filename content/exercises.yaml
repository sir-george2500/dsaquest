# Sample inputs for Mode C (Code Completion) differential judging.
#
# There are no expected outputs here on purpose. The intact template is the
# oracle: it is compiled and run on these inputs, and its output becomes the
# expected output for the learner's version. Add, move or resize a hole and
# nothing here needs to change.
#
# What these samples DO need to be is *discriminating*: an input set that never
# forces the window to shrink cannot tell a correct shrink loop from a missing
# one. Each entry below deliberately includes a degenerate case (k = 1, empty
# ranges, all-equal values) alongside an ordinary one.

sliding-window.cpp:
  # n k / n values
  - "8 2\n1 2 1 2 3 3 4 5\n"
  - "8 1\n1 1 2 2 2 3 1 1\n"          # k=1 forces shrinking on nearly every step
  - "6 6\n5 5 5 5 5 5\n"              # window never needs to shrink at all
  - "1 1\n42\n"                       # single element

prefix-sum.cpp:
  # n k / values / q / q x (l r v) / rows cols / grid / r1 c1 r2 c2
  - "6 3\n1 -1 3 2 -2 3\n2\n0 2 5\n1 3 -1\n3 3\n1 2 3\n4 5 6\n7 8 9\n1 1 2 2\n"
  - "5 0\n-1 -2 -3 -4 -5\n1\n0 4 10\n2 2\n1 1\n1 1\n0 0 1 1\n"   # all negative
  - "1 1\n7\n1\n0 0 3\n1 1\n9\n0 0 0 0\n"                          # single cell

hashing-frequency.cpp:
  # n target / n values / m / m words
  - "8 9\n2 7 11 15 2 7 4 5\n4\neat tea tan ate\n"
  - "5 100\n1 2 3 4 5\n3\nabc cba bac\n"     # no pair reaches the target
  - "4 4\n2 2 2 2\n2\naa aa\n"               # all duplicates

two-pointers.cpp:
  # n target / n values / m / m heights / word
  - "8 0\n-1 0 1 2 -1 -4 3 -3\n9\n1 8 6 2 5 4 8 3 7\nabcba\n"
  - "5 100\n1 2 3 4 5\n2\n1 1\nab\n"         # no pair sums to the target
  - "6 0\n0 0 0 0 0 0\n3\n5 5 5\naa\n"       # all-equal, exercises dedup

binary-search.cpp:
  # n / n sorted values / q / q queries
  - "8\n1 2 2 2 5 7 7 9\n4\n2 3 9 10\n"
  - "5\n1 1 1 1 1\n3\n0 1 2\n"               # all equal; lower/upper differ maximally
  - "1\n5\n3\n4 5 6\n"                       # single element, below/at/above

binary-search-answer.cpp:
  # n k / n values
  - "5 2\n7 2 5 10 8\n"
  - "5 1\n7 2 5 10 8\n"                      # k=1: the answer is the whole sum
  - "5 5\n7 2 5 10 8\n"                      # k=n: the answer is the maximum
  - "1 1\n3\n"                               # single element
