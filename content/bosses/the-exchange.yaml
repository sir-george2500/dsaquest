id: the-exchange
name: THE EXCHANGE
title: The Thing That Offers You a Better Deal
tier: 3
master_id: master_greed
patterns:
  - sorting-by-key
  - interval-scheduling
  - exchange-argument
  - median-minimisation

boss_hp: 110
player_hp: 100
damage_taken: 25
enrage_after: 2

# Strategist Dovan Rhe's final test proves the six secrets were held once. This
# gate proves they are still held, and it asks for understanding above the
# usual bar on purpose: greed is the one domain where a solution that passes
# the samples and is wrong looks exactly like a solution that is right.
gate:
  recognition: 0.55
  understanding: 0.55
  implementation: 0.50
  retention: 0.40
  master_final_test: true

# Four phases, 110 damage, one health bar. The fight is the curriculum in
# order: see which key sorts it, prove the local choice is safe, write it, and
# then meet the case where the argument does not hold.
phases:
  - kind: recognise
    damage: 15
    pattern: sorting-by-key
    title: Find the key

  - kind: explain
    damage: 25
    pattern: exchange-argument
    title: Prove the swap does not hurt

  - kind: implement
    damage: 30
    pattern: interval-scheduling
    title: Take what frees the room soonest

  - kind: survive
    damage: 40
    pattern: median-minimisation
    title: The average will lie to you

dialogue:
  intro:
    - >-
      It does not fight you. It makes you an offer, and the offer is always the
      largest thing in front of you, and it is always available, and it is
      sometimes correct.
    - >-
      Strategist Rhe made you prove every choice. I will not ask you to prove
      anything. I will simply accept whatever you take.
    - >-
      Four keys. Sort by the wrong one and the greedy answer is still an
      answer. It is just not the best one, and nothing here will tell you.

  phase_won:
    - You sorted it before you reached for it. Good.
    - Correct, and you can say why. Those are two different things.
    - It concedes the point.
    - You took the smaller thing. That was the harder choice.

  phase_lost:
    - >-
      You took the largest. You almost always may. This was one of the times
      you may not.
    - You had a rule. You did not have a proof. It cost you.
    - >-
      Wrong key. Everything after the sort was correct and everything after the
      sort was irrelevant.
    - You optimised the step in front of you and lost the row behind it.

  enrage:
    - >-
      It stops offering. From here it simply takes, and what it takes is
      whatever you were about to need.
    - >-
      Twice. It has learned which of the four you reach for first, and it will
      stop putting that one in front of you.

  victory:
    - It has nothing left to offer you. That is what beating this looks like.
    - >-
      Down. You will still be tempted by the biggest number for the rest of
      your life; you will simply check first.
    - The ridge is yours. Go on.

  perfect:
    - >-
      Four proofs, no guesses. Strategist Rhe will ask which one you found
      hardest, and he will not believe you if you say none.
    - >-
      Not one deal taken on trust. There is nothing left in it for you here.

  defeat:
    - >-
      It stands. You knew four techniques and reached for them in the order you
      learned them, which is not an argument.
    - >-
      Not today. Go back and find the case where the largest first fails. It is
      always small, and it is always in the notes.
    - >-
      You will beat this the day you can say, before writing anything, why the
      swap does not hurt. Not before.

  rematch:
    - Again. It has a new offer, and it is just as reasonable as the last one.
    - You have beaten it before. It does not repeat a bargain.

  gate_locked:
    - >-
      It has no interest in a student. Finish with Strategist Rhe, then hold
      what he taught you long enough that it is still there when you come back.
    - Not yet. {blockers}
