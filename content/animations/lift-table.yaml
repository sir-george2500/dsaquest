id: lift-table
title: A jump of four is a jump of two, twice
secret: power-of-two-jumps
pattern: binary-lifting
summary: >-
  The jump table on a chain of nine glades. Watch the order the levels are
  filled in — and then watch a climb of five take two reads instead of five
  steps.
kind: table
rows:
  - [".", ".", ".", ".", ".", ".", ".", ".", "."]
  - [".", ".", ".", ".", ".", ".", ".", ".", "."]
  - [".", ".", ".", ".", ".", ".", ".", ".", "."]
  - [".", ".", ".", ".", ".", ".", ".", ".", "."]
row_labels: ["up[0]  +1", "up[1]  +2", "up[2]  +4", "up[3]  +8"]
column_labels: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
idiom: "up[k][v] = up[k - 1][up[k - 1][v]];"
note: "the wood is a chain 1-2-3-4-5-6-7-8-9, topped at glade 1"

steps:
  - say: >-
      One column per glade, one row per size of jump. Empty. The question it
      will answer is "where does glade v land after exactly k steps upwards",
      for any k at all, in a handful of reads.

  - say: >-
      Level 0 needs no cleverness — one step up is the parent. Glade 1 is
      written as its own parent, which is the decision that makes every
      overlong jump later saturate at the top instead of reading nothing.
    set:
      "0,0": "1"
      "0,1": "1"
      "0,2": "2"
      "0,3": "3"
      "0,4": "4"
      "0,5": "5"
      "0,6": "6"
      "0,7": "7"
      "0,8": "8"
    mark:
      "0,0": "settled"
      "0,1": "settled"
      "0,2": "settled"
      "0,3": "settled"
      "0,4": "settled"
      "0,5": "settled"
      "0,6": "settled"
      "0,7": "settled"
      "0,8": "settled"
    note: "level 0 done — the parent of every glade"

  - say: >-
      Now two steps above glade 9. You do not walk it. You read one step above
      9, which is glade 8, and then read one step above glade 8.
    cursor: [1, 8]
    mark:
      "0,8": "active"
      "0,7": "active"
    note: "up[1][9] = up[0][ up[0][9] ] = up[0][8]"

  - say: >-
      Which is 7. That is the entire technique — a jump of two is a jump of
      one, twice — and every level above works the same way.
    set:
      "1,8": "7"
    mark:
      "0,8": "settled"
      "0,7": "settled"
      "1,8": "settled"
    note: "up[1][9] = 7"

  - say: >-
      The rest of level 1, by the same rule. Everything within two steps of the
      top has already saturated there, which is exactly what you want it to do.
    set:
      "1,0": "1"
      "1,1": "1"
      "1,2": "1"
      "1,3": "2"
      "1,4": "3"
      "1,5": "4"
      "1,6": "5"
      "1,7": "6"
    mark:
      "1,0": "settled"
      "1,1": "settled"
      "1,2": "settled"
      "1,3": "settled"
      "1,4": "settled"
      "1,5": "settled"
      "1,6": "settled"
      "1,7": "settled"
    note: "level 1 done — two steps up"

  - say: >-
      Stop and notice the order. Filling level 1 for glade 9 needed level 0 at
      glade 8 — a glade the jump chose, not one you picked. So the LEVEL loop
      has to be the outer one. Nest them the other way and shallow answers come
      out right while deep ones come out wrong.
    note: "for k: for v:   — never for v: for k:"

  - say: >-
      Level 2 is four steps: two steps, twice. Above glade 9, two steps lands
      on 7; two steps above 7 lands on 5.
    cursor: [2, 8]
    mark:
      "1,8": "active"
      "1,6": "active"
    note: "up[2][9] = up[1][ up[1][9] ] = up[1][7]"

  - say: >-
      Five. And the same read fills the whole of level 2.
    set:
      "2,8": "5"
      "2,0": "1"
      "2,1": "1"
      "2,2": "1"
      "2,3": "1"
      "2,4": "1"
      "2,5": "2"
      "2,6": "3"
      "2,7": "4"
    mark:
      "1,8": "settled"
      "1,6": "settled"
      "2,0": "settled"
      "2,1": "settled"
      "2,2": "settled"
      "2,3": "settled"
      "2,4": "settled"
      "2,5": "settled"
      "2,6": "settled"
      "2,7": "settled"
      "2,8": "settled"
    note: "level 2 done — four steps up"

  - say: >-
      Level 3 is eight steps, and this chain is only eight deep, so every entry
      saturates at the top. The table is built. It cost one pass per level.
    set:
      "3,0": "1"
      "3,1": "1"
      "3,2": "1"
      "3,3": "1"
      "3,4": "1"
      "3,5": "1"
      "3,6": "1"
      "3,7": "1"
      "3,8": "1"
    mark:
      "3,0": "settled"
      "3,1": "settled"
      "3,2": "settled"
      "3,3": "settled"
      "3,4": "settled"
      "3,5": "settled"
      "3,6": "settled"
      "3,7": "settled"
      "3,8": "settled"
    cursor: null
    note: "4 levels for 9 glades; at n = 200000 it is 18"

  - say: >-
      Now climb exactly five from glade 9. Five is 101 in binary. Bit 0 is set,
      so take the jump of one — read level 0 at glade 9.
    cursor: [0, 8]
    mark:
      "0,8": "answer"
    idiom: "for (int b = 0; b <= LOG; ++b) if (k >> b & 1) v = up[b][v];"
    note: "k = 5 = 101   at glade 9"

  - say: >-
      That lands on glade 8. Bit 1 is clear, so the jump of two is skipped
      entirely. Bit 2 is set — read level 2 at glade 8.
    cursor: [2, 7]
    mark:
      "2,7": "active"
    note: "k = 5 = 101   at glade 8, one bit spent"

  - say: >-
      Glade 4. Two reads, not five steps — and the check is the depth: glade 9
      sits 8 below the top, glade 4 sits 3 below, and 8 - 5 = 3. The same loop
      would climb 199999 in eighteen reads.
    mark:
      "2,7": "answer"
    cursor: null
    note: "answer = glade 4, in 2 reads"
