id: border-fallback
title: The chain of failure links
secret: the-border
pattern: prefix-function
summary: >-
  Building the border table of "aabaaab". Watch what k does when a character
  disagrees — it falls to the border of the border, never to zero, and that is
  the whole reason a loop inside a loop still costs O(n).
kind: array
data: [a, a, b, a, a, a, b]
labels: ["0", "1", "2", "3", "4", "5", "6"]
idiom: "while (k > 0 && s[i] != s[k]) k = pi[k - 1];"
note: "pi = [0, ., ., ., ., ., .]      k = 0"

steps:
  - say: >-
      pi[0] is 0 and always will be: one character has no border shorter than
      itself, and "shorter than itself" is what proper means. Start at i = 1
      with a matched length of k = 0, so k points at the very first character.
    point: {i: 1, k: 0}
    mark: {0: "in", 1: "active"}
    note: "pi = [0, ., ., ., ., ., .]      k = 0"

  - say: >-
      s[1] is 'a' and s[k] is 'a'. They agree, so the match grows by one:
      k becomes 1 and pi[1] = 1. The leading "a" is also a trailing "a".
    span: [0, 0]
    note: "pi = [0, 1, ., ., ., ., .]      k = 1"

  - say: >-
      Move to i = 2. k is 1, so the character to beat is s[1] = 'a'. But
      s[2] is 'b'. They disagree.
    point: {i: 2, k: 1}
    mark: {1: "in", 2: "active"}
    note: "pi = [0, 1, ., ., ., ., .]      k = 1   mismatch"

  - say: >-
      Here is the move that defines this algorithm. k does NOT reset to zero.
      The next candidate is the border of the length-1 match — pi[k-1] = pi[0]
      = 0 — because any shorter border of s[0..2] must also be a border of
      that match.
    point: {k: 0}
    mark: {1: "out", 0: "in"}
    span: null
    note: "pi = [0, 1, ., ., ., ., .]      k fell 1 -> 0"

  - say: >-
      k is 0 now, so the loop stops whatever happens. s[2] = 'b' still
      disagrees with s[0] = 'a', so pi[2] = 0. This position has no border at
      all.
    mark: {2: "settled"}
    note: "pi = [0, 1, 0, ., ., ., .]      k = 0"

  - say: >-
      i = 3. s[3] = 'a' agrees with s[0] = 'a', so k rises to 1 and
      pi[3] = 1.
    point: {i: 3, k: 0}
    mark: {1: "plain", 3: "active"}
    span: [0, 0]
    note: "pi = [0, 1, 0, 1, ., ., .]      k = 1"

  - say: >-
      i = 4. k is 1, so compare s[4] = 'a' with s[1] = 'a'. Agreement again:
      k rises to 2 and pi[4] = 2. The leading "aa" is also a trailing "aa".
    point: {i: 4, k: 1}
    mark: {3: "settled", 1: "in", 4: "active"}
    span: [0, 1]
    note: "pi = [0, 1, 0, 1, 2, ., .]      k = 2"

  - say: >-
      i = 5. k is 2, so the character to beat is s[2] = 'b'. s[5] is 'a'.
      Disagreement — and this is the interesting one, because k is 2 and there
      is somewhere to fall to that is not the floor.
    point: {i: 5, k: 2}
    mark: {1: "plain", 4: "settled", 2: "in", 5: "active"}
    note: "pi = [0, 1, 0, 1, 2, ., .]      k = 2   mismatch"

  - say: >-
      Fall back to pi[k-1] = pi[1] = 1, not to 0. The claim "aa" was too long,
      but the claim "a" survives it, and everything shorter than "aa" that
      could still work is a border of "aa".
    point: {k: 1}
    mark: {2: "out", 1: "in"}
    span: [0, 0]
    note: "pi = [0, 1, 0, 1, 2, ., .]      k fell 2 -> 1"

  - say: >-
      Now s[5] = 'a' agrees with s[1] = 'a'. k rises back to 2 and pi[5] = 2.
      Notice the position was resolved without ever looking back into the text
      — only into the table.
    mark: {5: "settled"}
    span: [0, 1]
    note: "pi = [0, 1, 0, 1, 2, 2, .]      k = 2"

  - say: >-
      i = 6, the last one. k is 2, so compare s[6] = 'b' with s[2] = 'b'. They
      agree: k rises to 3 and pi[6] = 3.
    point: {i: 6, k: 2}
    mark: {1: "plain", 2: "in", 6: "active"}
    span: [0, 2]
    note: "pi = [0, 1, 0, 1, 2, 2, 3]      k = 3"

  - say: >-
      The whole answer: "aab" begins the string and also ends it. The smallest
      period is 7 - 3 = 4, and since 7 % 4 is not 0 this string is not an exact
      repetition of anything.
    mark: {0: "answer", 1: "answer", 2: "answer", 4: "answer", 5: "answer", 6: "answer", 3: "settled"}
    span: [0, 2]
    note: "pi = [0, 1, 0, 1, 2, 2, 3]      border = aab, period = 4"

  - say: >-
      Count the moves k made. It rose six times, once per position that
      extended, and it fell twice. It can never fall further than it has
      risen, so across the whole string the inner loop runs at most n times in
      total — which is why two nested loops are still O(n).
    note: "k rose 6 times, fell 2 -- the falls can never outnumber the rises"
