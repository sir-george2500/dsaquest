id: define-the-state
title: One word decides whether the problem is solvable
secret: define-the-state
pattern: linear-dp
summary: >-
  The Competitive Programmer's Handbook's own array, 6 2 5 1 7 4 8 3. Watch one
  cell get filled at a time, and watch where the answer turns out to live — the
  last cell says 2, and the answer is 4.
kind: table
rows:
  - ["6", "2", "5", "1", "7", "4", "8", "3"]
  - ["", "", "", "", "", "", "", ""]
row_labels: ["a[i]", "dp[i]"]
column_labels: ["0", "1", "2", "3", "4", "5", "6", "7"]
idiom: "if (a[j] < a[i]) dp[i] = max(dp[i], dp[j] + 1);"
note: "dp[i] = the longest rising chain ENDING EXACTLY at i"

steps:
  - say: >-
      Before any loop exists, finish the sentence. dp[i] is the length of the
      longest rising chain ending EXACTLY at i. Drop the word "exactly" — "the
      longest chain among the first i" — and no transition can be written at
      all, because extending by a[i] needs to know what the previous chain
      ended with, and that sentence has thrown it away.
    cursor: [1, 0]
    mark: {"0,0": "settled", "0,1": "settled", "0,2": "settled", "0,3": "settled",
           "0,4": "settled", "0,5": "settled", "0,6": "settled", "0,7": "settled"}
    note: "the definition first; the loop is whatever it forces"

  - say: >-
      a[0] = 6. Nothing sits before it, so the only chain ending here is the 6
      alone. Every cell starts at 1 for exactly that reason — a single element
      is always a rising chain.
    cursor: [1, 0]
    set: {"1,0": "1"}
    mark: {"1,0": "settled"}
    note: "dp[0] = 1   (just 6)"

  - say: >-
      a[1] = 2. Look back at everything smaller than 2. There is nothing — 6 is
      larger — so no earlier chain can be extended and this cell is 1 as well.
    cursor: [1, 1]
    set: {"1,1": "1"}
    mark: {"0,0": "out", "1,1": "settled"}
    note: "dp[1] = 1   (6 is not smaller than 2, so nothing extends)"

  - say: >-
      a[2] = 5. Now look back for values below 5 — both 6 and 2 are candidates
      to check, and only the 2 qualifies. Its chain has length 1, so this one
      is 2.
    cursor: [1, 2]
    set: {"1,2": "2"}
    mark: {"0,0": "out", "0,1": "in", "1,2": "settled"}
    note: "dp[2] = dp[1] + 1 = 2   (the chain 2, 5)"

  - say: >-
      a[3] = 1, the smallest value so far. Nothing before it is smaller, so
      nothing extends and the cell is 1. Notice this cell is worth having
      anyway — a small value late is a good place for a future chain to start.
    cursor: [1, 3]
    set: {"1,3": "1"}
    mark: {"0,1": "plain", "0,0": "plain", "1,3": "settled"}
    note: "dp[3] = 1   (1 is a fresh start)"

  - say: >-
      a[4] = 7. Everything before it is smaller except nothing at all, so every
      earlier cell is a candidate. The best is the 5 at index 2, whose chain is
      2, giving 3.
    cursor: [1, 4]
    set: {"1,4": "3"}
    mark: {"0,2": "in", "1,4": "settled"}
    note: "dp[4] = dp[2] + 1 = 3   (2, 5, 7)"

  - say: >-
      a[5] = 4. The values below 4 are 2 at index 1 and 1 at index 3, both
      holding chains of length 1. So this cell is 2 — the 5 and the 7 are too
      large to help.
    cursor: [1, 5]
    set: {"1,5": "2"}
    mark: {"0,2": "plain", "0,1": "in", "0,3": "in", "1,5": "settled"}
    note: "dp[5] = 2   (2, 4)"

  - say: >-
      a[6] = 8, larger than everything before it, so every cell is a candidate
      and the best wins. That is index 4, holding 3. Four.
    cursor: [1, 6]
    set: {"1,6": "4"}
    mark: {"0,1": "plain", "0,3": "plain", "0,4": "in", "1,6": "answer"}
    note: "dp[6] = dp[4] + 1 = 4   (2, 5, 7, 8)"

  - say: >-
      a[7] = 3. Only the 2 and the 1 are below it, both holding 1, so the last
      cell is 2. The array is finished — and here is the part that costs people
      contests.
    cursor: [1, 7]
    set: {"1,7": "2"}
    mark: {"0,4": "plain", "1,7": "settled"}
    note: "dp = 1 1 2 1 3 2 4 2"

  - say: >-
      The answer is 4, and it is at index 6, not at the end. Your definition
      FIXED the ending position, so each cell answers only about chains ending
      there — and the best chain need not end at the last element. Print dp[7]
      and you get 2, with a recurrence that was correct all along. The sentence
      tells you where the answer lives; nothing else does.
    cursor: [1, 6]
    mark: {"1,6": "answer", "1,7": "out"}
    note: "answer = max over all cells = 4, NOT the last cell, which is 2"
