id: bfs-layers
title: BFS settles in layers
pattern: bfs-shortest-path
summary: >-
  Six nodes in a line-and-branch. Watch the distances get fixed one ring at a
  time, and watch what happens to the node you meet twice.
kind: array
data: ["-", "-", "-", "-", "-", "-"]
labels: ["0", "1", "2", "3", "4", "5"]
idiom: "if (dist[v] == -1) { dist[v] = dist[u] + 1; q.push(v); }"
note: "edges  0-1  0-2  1-3  2-3  3-4  4-5      dist = -1 means unseen"

steps:
  - say: >-
      Node 0 is the source. Its distance is 0 and it goes on the queue. Every
      other distance is -1, which here means "not seen yet", not "unreachable".
    set: {0: "0"}
    mark: {0: "active"}
    point: {u: 0}
    note: "queue: [0]        dist[0] = 0"

  - say: >-
      Take 0 off the queue and look at its neighbours, 1 and 2. Both are
      unseen, so both get distance 1 and both join the queue.
    set: {1: "1", 2: "1"}
    mark: {0: "settled", 1: "in", 2: "in"}
    span: [1, 2]
    note: "queue: [1, 2]     ring 1 is {1, 2}"

  - say: >-
      Take 1. Its neighbour 3 is unseen, so 3 gets distance 2. This is the
      whole of BFS: a node's distance is fixed by whoever reaches it first.
    point: {u: 1}
    set: {3: "2"}
    mark: {1: "settled", 3: "in"}
    span: [3, 3]
    note: "queue: [2, 3]     dist[3] = 2"

  - say: >-
      Now take 2. It is also adjacent to 3 — but 3 already has a distance, so
      nothing happens. The second path to a node is never shorter than the
      first, because the queue hands out nodes in order of distance.
    point: {u: 2}
    mark: {2: "settled", 3: "active"}
    note: "queue: [3]        3 already known: skip"

  - say: >-
      That skip is the line people delete. Without the `dist[v] == -1` guard,
      3 is queued twice, its distance is overwritten by a longer path, and the
      queue can grow without bound on a dense graph.
    mark: {3: "in"}
    note: "the guard is what makes it O(V + E)"

  - say: >-
      Take 3, reach 4 at distance 3. One frontier at a time, each exactly one
      further out than the last.
    point: {u: 3}
    set: {4: "3"}
    mark: {3: "settled", 4: "in"}
    span: [4, 4]
    note: "queue: [4]        ring 3 is {4}"

  - say: >-
      Take 4, reach 5 at distance 4. The queue empties and every reachable node
      has its final distance.
    point: {u: 4}
    set: {5: "4"}
    mark: {4: "settled", 5: "answer"}
    span: [5, 5]
    note: "queue: []         done"

  - say: >-
      Every distance was written exactly once, in non-decreasing order. That
      order is what makes BFS correct — and it holds only because every edge
      cost the same. Give one edge a weight of 5 and this ordering breaks
      silently, returning a path that still looks like a path.
    unpoint: [u]
    mark: {0: "settled", 1: "settled", 2: "settled", 3: "settled", 4: "settled"}
    span: null
    note: "unit edges only. Weighted edges need Dijkstra."
