id: prologue
title: The Path of Delta-X
beats:
  - id: title
    title: DSA QUEST
    text: >-
      The world has produced many great programmers.

      But only a few have learned to see the hidden patterns behind problems —
      to look at something they have never met and know, before writing a
      single line, what shape it is.

      They call that knowledge the TRUE SECRET OF ALGORITHMS.

  - id: the-masters
    title: The Masters
    art: master-arrays
    text: >-
      Eleven masters guard the road, and each holds a piece of it. One teaches
      you to read a constraint. One to walk a row a single time. One to halve.
      One that a number is thirty-two positions and not a quantity.

      They do not lecture and they do not flatter. They teach one small thing,
      drill it until it is reflex, and then take its name away and hand you a
      problem.

  - id: the-elite-coder
    title: The Elite Coder
    art: the-elite-coder
    text: >-
      One warrior has learned all of it.

      He entered every competition there was and left with the record in each.
      Five problems, three minutes forty-one, no penalty. No challenger has
      beaten him. No master has surpassed him.

      He believes algorithms are not meant to be understood. They are weapons.

      They call him THE ELITE CODER — and he is now searching for the True
      Secret himself.

  - id: the-warrior
    title: A young warrior arrives
    ask_name: true
    text: >-
      He knows some C++. He knows some data structures. He can sit with a
      problem and, often enough, get there.

      What he cannot do is look at a statement he has never seen and know what
      it is. He has solved the sliding window problem. He did not recognise the
      next one as a sliding window problem.

      That gap is why he came. Give him your name, and he will carry it the
      whole way.

  - id: the-quest
    title: What the road asks
    art: the-array-beast
    text: >-
      Eleven masters. Eleven guardians standing at the edge of their regions,
      each refusing to fight a student — they read your record before they will
      raise a hand, and what they want to see is that you still hold what you
      were taught weeks ago.

      Beyond the last of them is a gate, and a man sitting at a table with five
      problems face down.

  - id: begin
    title: The village
    text: >-
      The road ends at a village so small it has no wall.

      An old man sits outside the last house doing nothing at all. He is Elder
      Vhast, and he will not be hurried, and he is going to spend three days
      teaching you to count before he permits you to write anything.

      This is where it starts, {hero}.
